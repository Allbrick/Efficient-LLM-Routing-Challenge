<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM 라우팅 워크스페이스</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="라우터 설정">
        <div class="brand">
          <div class="brand-mark">R</div>
          <div>
            <h1>Routing Lab</h1>
            <p>로컬 AI 라우터</p>
          </div>
        </div>

        <button id="newChat" class="new-chat" type="button">새 대화</button>

        <details class="side-panel">
          <summary>라우터 설정</summary>
          <div class="settings-list">
            <label>
              라우터
              <select id="router"></select>
            </label>
            <label>
              예산 tier
              <select id="tier">
                <option value="fast">Fast</option>
                <option value="balanced" selected>Balanced</option>
                <option value="premium">Premium</option>
              </select>
            </label>
          </div>
        </details>

        <details class="side-panel">
          <summary>고급 입력</summary>
          <div class="settings-list">
            <label>
              작업 유형
              <input id="taskType" placeholder="auto" />
            </label>
            <label>
              난이도
              <select id="difficulty">
                <option value="" selected>auto</option>
                <option value="trivial">trivial</option>
                <option value="medium">medium</option>
                <option value="hard">hard</option>
                <option value="unknown">unknown</option>
              </select>
            </label>
            <label>
              위험도
              <select id="riskLevel">
                <option value="" selected>auto</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
                <option value="unknown">unknown</option>
              </select>
            </label>
            <label>
              평가 방식
              <select id="evaluationType">
                <option value="" selected>auto</option>
                <option value="exact_match">exact_match</option>
                <option value="numeric_count">numeric_count</option>
                <option value="unit_test">unit_test</option>
                <option value="exact_json">exact_json</option>
                <option value="constraint_check">constraint_check</option>
                <option value="rubric_check">rubric_check</option>
                <option value="required_clarification">required_clarification</option>
                <option value="refusal_check">refusal_check</option>
              </select>
            </label>
          </div>
        </details>

        <div id="stackInfo" class="stack-info">라우터 서버 연결 중...</div>
      </aside>

      <main class="chat-pane">
        <header class="chat-header">
          <div>
            <h2>AI 라우팅</h2>
            <p>프롬프트를 입력하면 라우터가 모델을 고르고 AI 응답을 보여줍니다.</p>
          </div>
          <div id="routeSummary" class="route-summary empty">대기 중</div>
        </header>

        <section id="transcript" class="transcript" aria-live="polite">
          <div class="welcome-card">
            <h3>무엇을 라우팅할까요?</h3>
            <p>기본 화면은 프롬프트와 AI 출력에 집중합니다. 라우터 설정과 후보 비교는 필요할 때만 펼쳐서 확인할 수 있습니다.</p>
          </div>
        </section>

        <form id="routeForm" class="composer">
          <textarea id="prompt" rows="1" placeholder="메시지를 입력하세요. 예: 2 + 3의 값만 숫자로 답해줘"></textarea>
          <button type="submit" aria-label="전송">전송</button>
        </form>
      </main>

      <aside class="inspector" aria-label="라우팅 결과">
        <div class="inspector-panel">
          <div class="inspector-title">
            <span>AI 상태</span>
            <b id="aiMeta">대기 중</b>
          </div>
        </div>

        <details class="inspector-panel">
          <summary>라우팅 요약</summary>
          <div id="routerDecision" class="decision empty">아직 요청이 없습니다.</div>
        </details>

        <details class="inspector-panel">
          <summary>후보 비교</summary>
          <div id="candidates" class="candidate-list"></div>
        </details>

        <details class="inspector-panel">
          <summary>CSV/TXT 평가·학습</summary>
          <div class="csv-tool">
            <label>
              CSV/TXT 파일
              <input id="csvFile" type="file" accept=".csv,.txt,text/csv,text/plain" />
            </label>
            <div class="csv-actions">
              <button id="evaluateCsv" type="button">정답 비교</button>
              <button id="trainCsv" type="button">학습</button>
            </div>
            <div id="csvStatus" class="csv-status empty">CSV 또는 TXT를 선택하세요.</div>
            <div id="csvResult" class="csv-result"></div>
          </div>
        </details>
      </aside>
    </div>
    <script src="app.js"></script>
  </body>
</html>
